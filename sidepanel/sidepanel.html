<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip History</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">Clip History</span>
      <span class="count" id="count"></span>
    </header>

    <div class="actions">
      <button id="capture" class="btn primary" type="button">Capture</button>
      <button id="paste" class="btn" type="button">Paste</button>
      <button id="clear" class="btn danger" type="button">Clear all</button>
    </div>

    <p class="hint" id="hint">
      Captures land here automatically. Press <kbd>Ctrl/Cmd+V</kbd> to drop in
      an image from another app.
    </p>

    <div class="empty" id="empty" hidden>No clips yet.</div>

    <div class="grid" id="grid"></div>

    <span class="toast" id="toast" hidden></span>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
